<header class="chat-header">
  @if (chat(); as chat) {
    <div class="header-left">
      <button mat-icon-button class="nav-button" aria-label="Open navigation" matTooltip="Open navigation" (click)="toggleNavigation()"><mat-icon>menu</mat-icon></button>
      <div class="title-area"><div class="title-line"><button mat-button class="title-button" type="button" (click)="rename()" [attr.aria-label]="'Rename chat ' + (chat.title || 'Untitled chat')"><span class="title-text">{{ chat.title || 'Untitled chat' }}</span></button>@if (chat.archived) { <span class="badge stopped">Archived</span> }</div><div class="badges"><span class="badge agent">{{ agentLabel(chat.agent) }}</span>@if (chat.turn_state === 'PROMPTING') { <span class="badge thinking">Thinking…</span> }</div></div>
    </div>
    <div class="header-actions">
      <button mat-icon-button matTooltip="Chat configuration" aria-label="Chat configuration" (click)="configRequested.emit()"><mat-icon>tune</mat-icon></button>
      <button mat-icon-button [matMenuTriggerFor]="actions" aria-label="Chat actions"><mat-icon>more_vert</mat-icon></button>
      <mat-menu #actions="matMenu"><button mat-menu-item type="button" (click)="rename()"><mat-icon>edit</mat-icon><span>Rename chat</span></button><button mat-menu-item type="button" (click)="archive()"><mat-icon>{{ chat.archived ? 'unarchive' : 'archive' }}</mat-icon><span>{{ chat.archived ? 'Unarchive chat' : 'Archive chat' }}</span></button><button mat-menu-item type="button" (click)="remove()"><mat-icon class="destructive-icon">delete</mat-icon><span>Delete chat</span></button></mat-menu>
    </div>
  } @else { <span class="no-chat">No chat selected</span> }
</header>
