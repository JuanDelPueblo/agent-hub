<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="dialogRef.close(false)">Cancel</button>
  <button
    mat-flat-button
    [class.destructive]="data.destructive"
    type="button"
    (click)="dialogRef.close(true)"
  >
    {{ data.confirmLabel }}
  </button>
</mat-dialog-actions>
