[package]
name = "agent-hub"
version = "0.2.0"
edition = "2021"
authors = ["JuanDelPueblo"]
description = "Persistent single-owner ACP project and chat supervisor"
license = "GPL-3.0-only"
repository = "https://github.com/JuanDelPueblo/agent-hub"
keywords = ["acp", "agent", "supervisor", "claude", "codex"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# Async runtime
tokio = { version = "1.43", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.38", features = ["bundled"] }

# Web server
axum = { version = "0.7", features = ["ws"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors"] }
rust-embed = { version = "8.5", features = ["axum"] }
mime_guess = "2.0"

# WebSocket
futures-util = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Utilities
thiserror = "2.0"
anyhow = "1.0"
uuid = { version = "1.11", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# ACP protocol types
agent-client-protocol-schema = { version = "0.11", features = ["unstable_cancel_request"] }

# Process group / Job Object wrapper for cross-platform child process cleanup
process-wrap = { version = "6", default-features = false, features = ["tokio1", "job-object", "kill-on-drop", "process-group"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_JobObjects"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.14"

[[bin]]
name = "agent-hub"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
